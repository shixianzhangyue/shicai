[package]
name = "talent-vault"
version = "0.1.0"
description = "Shicore 拾才 - 本地招聘管理系统"
authors = ["Shicore Team"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "talent_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
refinery = { version = "0.8", features = ["rusqlite"] }
zip = "2.2"
walkdir = "2.5"
validator = { version = "0.18", features = ["derive"] }
log = "0.4"
simplelog = "0.12"
nanoid = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
pdf-extract = "0.7"
docx-rs = "0.4"
thiserror = "1.0"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread"] }
regex = "1.12.3"
aes-gcm = "0.10"
rand = "0.8"

[profile.release]
strip = true
lto = true
# "s" keeps the binary small without the runtime cost of "z" (which is
# noticeable on the OCR/AES/regex-heavy paths in this app).
opt-level = "s"
